models:
  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              config:
                severity: warn
                warn_if:  ">0"
                error_if: ">1000"
              arguments: 
                values: ['placed','shipped','completed','returned']
          