models:
  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments: 
                 values:
                  - shipped
                  - return_pending
                  - completed
                  - placed
                  - returned
                  - processing
  