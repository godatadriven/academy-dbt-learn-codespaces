models:
  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments: # New and now required :) 
                values: ['completed', 'returned', 'shipped', 'placed', 'return_pending', 'processing']

      - name: order_date
        tests:
          - assert_order_date_in_past

  - name: stg_jaffle_shop__customers
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - first_name
              - last_name
    columns:
      - name: name_sk
        data_tests:
          - unique
          