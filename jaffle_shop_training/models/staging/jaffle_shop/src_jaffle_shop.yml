sources: 
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    tables: 
      - name: customers
      - name: orders
        identifier: orders
        columns:
          - name: id
            data_tests: 
              - unique
              - not_null
          - name: status
            description: "{{ doc('order_status')}}"
            data_tests:
              - accepted_values:
                  config:
                    severity: error
                    error_if: ">10"
                    warn_if: ">0"
                  values:
                    - shipped
                    - placed
                    - returned
                    - completed
                    - return_pending
          - name: user_id
            data_tests:
              - relationships:
                  to: ref('stg_jaffle_shop__customers') 
                  field: customer_id