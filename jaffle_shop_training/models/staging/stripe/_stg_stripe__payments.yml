version: 2

models:
  - name: stg_stripe__payment
    description: ""
    columns:
      - name: payment_id
        data_type: number
        description: ""
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_type: number
        description: ""

      - name: payment_method
        data_type: varchar
        description: ""

      - name: payment_status
        data_type: varchar
        description: ""
        data_tests:
             - accepted_values:
                 values:
                   - fail
                   - success
      - name: payment_amount
        data_type: number
        description: ""
        data_tests:
          - is_even:
              severity: warn

      - name: created_at
        data_type: date
        description: ""

      - name: batched_at
        data_type: timestamp_ltz
        description: ""
