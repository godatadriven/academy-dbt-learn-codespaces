models:
  - name: stg_stripe__payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: payment_method
        data_tests:
          - accepted_values:
              values:
                - bank_transfer
                - coupon
                - credit_card
                - gift_card
              config:
                severity: error
                error_if: ">10"
                warn_if: ">0"