models:
  - name: stg_stripe__payment
    columns:
      - name: payment_id
        data_tests:
        - unique
        - not_null
      - name: payment_status
        data_tests:
          - accepted_values:
              config: 
                severity: error
                warn_if: ">0"
                error_if: ">10"
              arguments: 
                values: ['fail', 'success']
