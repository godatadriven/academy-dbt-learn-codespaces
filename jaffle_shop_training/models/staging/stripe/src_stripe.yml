sources:
 - name: stripe
   database: raw
   schema: stripe # optional, recommend to keep it in
   description: source with all payments
   tables:
     - name: payments # this is the name we decide on
       identifier: payment # this is the exact reference in the warehouse
       columns:
         - name: id
           data_tests:
             - unique
             - not_null
         - name: paymentmethod
           data_tests:
              - accepted_values:
                  values: 
                    - bank_transfer
                    - gift_card
                    - credit_card
                    - coupon