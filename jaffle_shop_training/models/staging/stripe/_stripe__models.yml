models:
  - name: stg_stripe_payment
    columns:
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments: # New and now required :) 
                values: ['coupon', 'gift_card', 'bank_transfer', 'credit_card']
      - name: amount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5000
                inclusive: true
          - is_negative
      
      - name: created_at
        tests:
          - assert_order_date_in_past