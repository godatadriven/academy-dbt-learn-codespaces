version: 2

models:
  - name: stg_stripe__payment
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - not_null

      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']

      - name: amount
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"