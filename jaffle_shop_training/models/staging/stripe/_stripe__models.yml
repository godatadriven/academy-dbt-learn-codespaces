models:
  - name: stg_stripe__payment
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['gift_card','credit_card','bank_transfer','coupon']
      - name: amount
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5000


