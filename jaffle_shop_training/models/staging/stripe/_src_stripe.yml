sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        identifier: payment
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value:0
                max_value:5000
                inclusive:True
            
        columns:
          - name: id
            data_tests:
              - unique
              - not_null      
          - name: paymentmethod
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['bank_transfer', 'gift_card', 'credit_card', 'coupon']

        