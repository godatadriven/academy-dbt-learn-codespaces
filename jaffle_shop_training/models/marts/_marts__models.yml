models:
  - name: fct_orders
    columns:
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: amount
        data_tests:
          - no_negative_values
  - name: dim_customers
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "number_of_orders >= 0"
        