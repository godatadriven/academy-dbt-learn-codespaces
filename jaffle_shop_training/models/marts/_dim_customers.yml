version: 2

models:
  - name: dim_customers
    description: "Each row represents a customer"
    columns:
      - name: customer_id
        data_type: number
        description: "This is the primary key"

      - name: first_name
        data_type: varchar
        description: "The first name of the customers"

      - name: last_name
        data_type: varchar
        description: "The last name of the customer"

      - name: first_order_date
        data_type: date
        description: "The first order date of the customer"

      - name: most_recent_order_date
        data_type: date
        description: "the date of the most recent order of the customer"

      - name: number_of_orders
        data_type: number
        description: ""
