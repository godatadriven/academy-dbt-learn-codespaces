models:
    - name: stg_jaffle_shop__orders
      columns:
        - name: order_id
          data_tests:
            - unique
            - not_null
        - name: status
          data_tests:
            - accepted_values:
                config:
                  severity: error
                  warn_if: ">0"
                  error_if: ">10"
                arguments: 
                  values: ['placed', 'shipped', 'completed', 'returned']
            
            