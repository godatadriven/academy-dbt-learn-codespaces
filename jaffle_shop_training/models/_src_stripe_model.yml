models:
  - name: stg_stripe__payments
    columns:
      - name: order_id
        data_tests:
          - unique
      - name: customer_id
        data tests:
          - relationships:
              to: ref('customers')
              field: id
      - name: status
        data_tests:
          - accepted_values:
              config:
                severity: error
                warn_if: ">20"
                error_if: ">100"
              arguments:
                values: ["success", "fail"]
